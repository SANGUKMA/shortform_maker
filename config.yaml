# 한방컷 – 쇼츠메이커 기본 설정

# 영상 템플릿
template:
  bg_color: "#1B2A4A"       # "#1B2A4A" (네이비) 또는 "black" (검정) 선택
  canvas_width: 1080
  canvas_height: 1920
  video_crf: 23
  video_preset: "fast"

# 상단 제목
title:
  font_size: 108
  line_gap: 60
  color: "white"
  y: 80
  border_width: 3
  border_color: "black"

# 하단 기관명
org:
  font_size: 76
  color: "white"
  y_offset: 120
  border_width: 2
  border_color: "black"
  logo_path: ""             # 로고 PNG 경로 (비워두면 텍스트만 표시)

# 자막
subtitle:
  font_name: "Black Han Sans"
  font_size: 48
  outline: 2
  margin_v: 340

# 다운로드
download:
  max_resolution: 720
  format: "mp4"

# Claude (전사본에서 하이라이트 선택 + YouTube 설명/태그 생성)
claude:
  model: "claude-haiku-5-5"
  min_score: 40               # 이 점수 미만 클립은 버림 (개수 설정보다 우선)

# Whisper
whisper:
  model: "whisper-1"
  language: "ko"
  no_speech_threshold: 0.3    # "말이 아닐 확률"이 이 값 이상인 문장은 음악·무음으로 보고 제외
                              # 실측: 설교 최대 0.12 / 찬양 중앙값 0.53 / 음악 중앙값 0.82

# 클립 경계 정렬 (wav2vec2) — 켜고 끄기는 .env의 ALIGN_ENABLED (로컬 전용)
align:
  model: "kresnik/wav2vec2-large-xlsr-korean"
